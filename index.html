<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misión: Recolectar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#081923;color:#eef7fa}
main{max-width:920px;margin:auto;padding:18px}.card{background:#102c3b;border:1px solid #2b5266;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 25px #0002}
h1{margin:0 0 5px;font-size:2rem}h2{margin-top:8px}.muted{color:#a9c2ce}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:#0b2230;padding:12px;border-radius:12px}.value{font-weight:800;font-size:1.35rem}
input,button{font:inherit;border-radius:10px;padding:12px}input{width:100%;background:#081923;color:white;border:1px solid #456a7a;margin:6px 0 12px}
button{border:0;background:#2eb383;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.choice{width:100%;display:block;text-align:left;margin:10px 0;background:#193e50;border:1px solid #315d70;color:white}
.choice:hover{background:#23536a}.choice.selected{outline:3px solid #f3c657}
.area{display:inline-block;background:#234c60;padding:6px 10px;border-radius:99px;font-size:.9rem}
.progress{height:10px;background:#203c4b;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#39c992;width:0;transition:.3s}
.feedback{padding:15px;border-radius:13px;margin-top:15px}.good{background:#12543f}.bad{background:#63361d}
.hidden{display:none}.score{font-size:1.5rem;font-weight:900}.small{font-size:.9rem}
</style></head><body><main>
<section id="join" class="card">
<h1>🔎 MISIÓN: RECOLECTAR</h1><p class="muted">Técnicas e instrumentos para la recolección de datos</p>
<p>Resuelve 10 misiones de investigación aplicadas a Ingeniería Ambiental e Ingeniería Industrial.</p>
<label>Nombre del investigador</label><input id="name" placeholder="Ej. Mabel">
<label>Código de sala</label><input id="room" placeholder="Ej. MET-482">
<button onclick="join()">🚀 Unirme a la misión</button>
<div id="joinMsg"></div>
</section>

<section id="game" class="hidden">
<div class="card"><div class="grid">
<div class="stat"><span class="muted">Investigador</span><div id="pname" class="value"></div></div>
<div class="stat"><span class="muted">Sala</span><div id="rname" class="value"></div></div>
<div class="stat"><span class="muted">Puntos</span><div id="score" class="value">0</div></div>
</div><div class="progress"><div id="bar" class="bar"></div></div></div>

<div class="card">
<span id="area" class="area"></span>
<div class="small muted" id="mission"></div>
<h2 id="title"></h2><p id="scenario"></p><h3 id="prompt"></h3>
<div id="choices"></div><div id="feedback" class="hidden"></div>
<button id="next" class="hidden" onclick="nextMission()">Continuar →</button>
</div>

<div class="card"><h3>📚 Aprendizaje</h3><p id="learn" class="muted"></p></div>
</section>

<section id="finish" class="card hidden">
<h1>🏆 Misión completada</h1><p id="final"></p><div id="finalScore" class="score"></div>
<p id="summary"></p><button onclick="location.reload()">Jugar nuevamente</button>
</section>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=(SUPABASE_URL.startsWith("http") && (SUPABASE_ANON_KEY.startsWith("sb_publishable_") || SUPABASE_ANON_KEY.startsWith("eyJ")))?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const missions=[{"area": "Ingeniería Ambiental", "title": "Calidad del agua 💧", "scenario": "Una empresa quiere investigar la percepción de 300 habitantes que viven cerca de un río sobre los cambios en la calidad del agua.", "prompt": "¿Qué técnica sería más adecuada para obtener información de muchas personas de forma organizada?", "choices": ["Encuesta", "Entrevista individual a los 300 habitantes", "Observación", "Análisis documental"], "answer": 0, "instrument": "Cuestionario", "why": "La encuesta permite recoger información estructurada de un número amplio de participantes.", "consequence": "El equipo puede recopilar información de los 300 habitantes de manera organizada dentro del tiempo disponible."}, {"area": "Ingeniería Ambiental", "title": "Residuos sólidos ♻️", "scenario": "Un investigador quiere conocer cómo separan realmente los residuos los estudiantes de una universidad. No quiere preguntarles qué hacen; quiere registrar directamente su comportamiento.", "prompt": "¿Qué técnica debería utilizar?", "choices": ["Encuesta", "Observación", "Entrevista", "Grupo focal"], "answer": 1, "instrument": "Ficha o guía de observación", "why": "La observación permite registrar directamente comportamientos y situaciones que ocurren en un contexto real.", "consequence": "El investigador observa el comportamiento real de separación y puede registrar lo que ocurre, no solo lo que los estudiantes dicen hacer."}, {"area": "Ingeniería Ambiental", "title": "Contaminación de un río 🏞️", "scenario": "Una comunidad ubicada cerca de un río está preocupada por la contaminación. El investigador quiere conocer las experiencias, percepciones y preocupaciones de habitantes y líderes comunitarios.", "prompt": "¿Qué técnica es más apropiada para profundizar en esas experiencias?", "choices": ["Entrevista", "Encuesta exclusivamente", "Análisis documental", "Observación"], "answer": 0, "instrument": "Guía de entrevista", "why": "La entrevista permite profundizar en experiencias, opiniones, percepciones y explicaciones de los participantes.", "consequence": "El investigador puede conocer las experiencias de la comunidad y explorar respuestas que requieren mayor profundidad."}, {"area": "Ingeniería Ambiental", "title": "Impacto ambiental de un proyecto 🌳", "scenario": "Una empresa realiza un proyecto que podría afectar un ecosistema. El equipo quiere conocer opiniones de habitantes, ambientalistas y otros actores mediante una conversación grupal donde puedan debatir.", "prompt": "¿Qué técnica sería adecuada?", "choices": ["Grupo focal", "Encuesta", "Observación", "Análisis documental"], "answer": 0, "instrument": "Guía de discusión", "why": "El grupo focal facilita una discusión guiada entre varios participantes para explorar opiniones y experiencias.", "consequence": "Las opiniones de los participantes pueden interactuar entre sí y revelar acuerdos, desacuerdos y temas que el equipo no había previsto."}, {"area": "Ingeniería Ambiental", "title": "Investigación ambiental histórica 📚", "scenario": "Una ingeniera ambiental debe estudiar la evolución de la contaminación de una zona durante los últimos diez años. Tiene informes ambientales, resultados de monitoreos, estudios anteriores y registros históricos.", "prompt": "¿Qué técnica debe utilizar principalmente?", "choices": ["Entrevista", "Encuesta", "Análisis documental", "Grupo focal"], "answer": 2, "instrument": "Ficha de análisis documental", "why": "El análisis documental permite recuperar y organizar información existente en documentos y registros relevantes.", "consequence": "El equipo puede reconstruir la evolución histórica usando información ya disponible, sin tener que recolectar nuevamente todos los datos."}, {"area": "Ingeniería Industrial", "title": "Productividad de los trabajadores ⚙️", "scenario": "Una empresa manufacturera quiere conocer la percepción de 400 trabajadores sobre las condiciones de seguridad y organización de sus puestos de trabajo.", "prompt": "¿Qué técnica utilizarías para obtener información de muchas personas rápidamente?", "choices": ["Encuesta", "Entrevista individual a todos", "Grupo focal con 3 trabajadores", "Observación durante un año"], "answer": 0, "instrument": "Cuestionario", "why": "La encuesta es útil cuando se necesita obtener información estructurada de un número amplio de trabajadores.", "consequence": "El equipo puede comparar las respuestas de muchos trabajadores y detectar tendencias generales."}, {"area": "Ingeniería Industrial", "title": "Línea de producción 🏭", "scenario": "Una empresa sospecha que existen pérdidas de tiempo en una línea de producción. El investigador quiere registrar tiempos muertos, movimientos innecesarios, esperas, desplazamientos e interrupciones.", "prompt": "¿Qué técnica es más adecuada?", "choices": ["Entrevista", "Observación", "Grupo focal", "Análisis documental"], "answer": 1, "instrument": "Ficha de observación", "why": "La observación permite registrar directamente lo que ocurre en el proceso productivo.", "consequence": "El investigador puede identificar en qué puntos reales del proceso aparecen esperas, movimientos o interrupciones."}, {"area": "Ingeniería Industrial", "title": "Rotación del personal 👷", "scenario": "Una empresa presenta una alta rotación de trabajadores. La investigación busca conocer por qué algunos empleados decidieron abandonar la organización y profundizar en sus experiencias y motivos.", "prompt": "¿Qué técnica sería más adecuada?", "choices": ["Entrevista", "Observación", "Encuesta exclusivamente", "Análisis de inventario"], "answer": 0, "instrument": "Guía de entrevista", "why": "La entrevista permite profundizar en razones, experiencias y percepciones de los trabajadores.", "consequence": "El investigador puede descubrir motivos que una pregunta cerrada podría no revelar."}, {"area": "Ingeniería Industrial", "title": "Satisfacción laboral 👥", "scenario": "Una empresa quiere implementar un nuevo sistema de organización del trabajo. Antes de hacerlo, quiere reunir trabajadores de diferentes áreas para conocer opiniones, intercambiar experiencias y detectar problemas.", "prompt": "¿Qué técnica utilizarías?", "choices": ["Grupo focal", "Observación exclusivamente", "Análisis documental", "Inspección de inventario"], "answer": 0, "instrument": "Guía de discusión", "why": "El grupo focal facilita la interacción entre participantes para explorar opiniones, experiencias y problemas comunes.", "consequence": "La discusión permite que una experiencia de un trabajador genere nuevas ideas o problemas aportados por otros."}, {"area": "Ingeniería Industrial", "title": "El proyecto final 📊", "scenario": "Una empresa quiere investigar las causas de los retrasos en sus entregas. Tiene registros históricos, informes de producción, opiniones de trabajadores y posibilidad de observar el proceso.", "prompt": "¿Cuál es la estrategia más completa para iniciar la recolección?", "choices": ["Usar una sola técnica para todo", "Combinar análisis documental, entrevistas y observación según el tipo de información", "Solo entrevistar al gerente", "No recolectar datos"], "answer": 1, "instrument": "Ficha documental + guía de entrevista + ficha de observación", "why": "La técnica debe seleccionarse según el tipo de información: documentos para registros existentes, entrevistas para experiencias y observación para procesos reales.", "consequence": "El equipo integra diferentes fuentes y obtiene una visión más completa de las causas de los retrasos.", "final": true}];
let id=crypto.randomUUID(), name="", room="", idx=0, score=0, answered=false;

function show(id2){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById(id2).classList.remove("hidden")}
function setMsg(t,cls=""){document.getElementById("joinMsg").innerHTML='<p class="'+cls+'">'+t+'</p>'}

async function join(){
 name=document.getElementById("name").value.trim();room=document.getElementById("room").value.trim().toUpperCase();
 if(!name||!room){setMsg("Escribe tu nombre y el código de sala.");return}
 if(!sb){setMsg("La interfaz está lista, pero falta conectar Supabase. Revisa README.md.","bad");return}
 const {error}=await sb.from("players").insert({id,room_code:room,name,score:0,progress:0,status:"playing",area:"Mixto"});
 if(error){setMsg("No se pudo entrar a la sala: "+error.message,"bad");return}
 document.getElementById("pname").textContent=name;document.getElementById("rname").textContent=room;
 show("game");render();
}

function render(){
 answered=false;const m=missions[idx];
 document.getElementById("area").textContent=m.area;document.getElementById("mission").textContent="MISIÓN "+(idx+1)+" DE 10";
 document.getElementById("title").textContent=m.title;document.getElementById("scenario").textContent=m.scenario;document.getElementById("prompt").textContent=m.prompt;
 document.getElementById("learn").textContent="";document.getElementById("feedback").className="hidden";document.getElementById("next").className="hidden";
 document.getElementById("bar").style.width=(idx/10*100)+"%";
 const box=document.getElementById("choices");box.innerHTML="";
 m.choices.forEach((c,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=c;b.onclick=()=>answer(i,b);box.appendChild(b)});
}

async function answer(choice,btn){
 if(answered)return;answered=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 const m=missions[idx], correct=choice===m.answer, points=correct?(m.final?15:10):0;score+=points;
 btn.classList.add("selected");
 const f=document.getElementById("feedback");f.className="feedback "+(correct?"good":"bad");
 f.innerHTML=(correct?"✅ ¡Buena decisión!":"⚠️ Tu estrategia no es la más adecuada para este objetivo.")+
 "<br><br><b>Consecuencia:</b> "+(correct?m.consequence:"El equipo debe replantear la estrategia porque la información obtenida no responde de la mejor manera al objetivo.")+
 "<br><br><b>"+(points?"+":"")+" "+points+" puntos</b>";
 document.getElementById("learn").textContent="Instrumento: "+m.instrument+". "+m.why;
 document.getElementById("score").textContent=score;
 document.getElementById("next").className="";
 if(sb){
   await sb.from("answers").insert({player_id:id,room_code:room,mission:idx+1,choice,correct,points});
   await sb.from("players").update({score,progress:idx+1,status:idx===9?"finished":"playing"}).eq("id",id);
 }
}
function nextMission(){idx++;if(idx<missions.length)render();else finish()}
async function finish(){
 document.getElementById("bar").style.width="100%";show("finish");
 const label=score>=90?"Investigador experto":score>=75?"Investigador competente":score>=50?"Investigador en formación":"Investigador aprendiz";
 document.getElementById("final").textContent=label+". Has completado las 10 misiones.";
 document.getElementById("finalScore").textContent=score+" / 105 puntos";
 document.getElementById("summary").textContent="Tu recorrido incluyó 5 situaciones de Ingeniería Ambiental y 5 de Ingeniería Industrial.";
 if(sb) await sb.from("players").update({score,progress:10,status:"finished"}).eq("id",id);
}
</script></main></body></html>
